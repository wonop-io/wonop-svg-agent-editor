<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SVG Editor</title>
<style>
  :root { color-scheme: light dark; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--wm-text, #242428); background: var(--wm-content, #fafafa); }
  * { box-sizing: border-box; }
  body { margin: 0; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; min-height: 32px; padding: 5px 10px; background: transparent; border: 0; border-radius: 6px; white-space: nowrap; }
  button:hover { background: var(--wm-fill-strong, #8882); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--wm-primary, #242428); color: var(--wm-primary-text, #fafafa); }
  :focus-visible { outline: 2px solid var(--wm-text, #555); outline-offset: -2px; }
  input { background: var(--wm-content, #fff); border: 1px solid var(--wm-hairline, #8885); border-radius: 6px; padding: 9px; width: 100%; }
  main { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  #workspace { min-height: 0; flex: 1; display: grid; grid-template-columns: minmax(240px, 39%) minmax(0, 1fr); }
  #workspace.preview-only { grid-template-columns: minmax(0, 1fr); }
  #workspace.preview-only #source-pane { display: none; }
  section { min-width: 0; min-height: 0; }
  #source-pane { display: flex; flex-direction: column; border-right: 1px solid var(--wm-hairline, #8883); }
  .pane-heading { display: flex; align-items: center; min-height: 36px; flex: none; padding: 0 12px; gap: 8px; }
  .pane-heading label { font-weight: 600; }
  #position { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--wm-text-dim, #73737b); }
  textarea { flex: 1; width: 100%; min-height: 0; resize: none; border: 0; border-radius: 0; outline: none; padding: 8px 12px 16px; font: 13px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; tab-size: 2; white-space: pre; color: inherit; caret-color: currentColor; background: var(--wm-content, #fafafa); }
  textarea:focus-visible { outline: 1px solid var(--wm-hairline, #8886); }
  ::selection { background: var(--wm-fill-strong, #8885); }
  #preview-pane { position: relative; display: flex; flex-direction: column; }
  #preview-tools { display: flex; align-items: center; gap: 2px; min-height: 36px; padding: 0 8px; flex-wrap: wrap; }
  #preview-tools .space { flex: 1; }
  select { border: 0; background: transparent; padding: 5px; }
  #actual { min-width: 48px; font-variant-numeric: tabular-nums; }
  button svg { width: 16px; height: 16px; display: block; pointer-events: none; }
  .icon { width: 32px; padding: 8px; display: inline-flex; align-items: center; justify-content: center; }
  #drawing-area { min-height: 0; flex: 1; display: flex; }
  #tools { width: 44px; flex: none; display: flex; flex-direction: column; align-items: center; padding: 8px 6px; gap: 4px; background: var(--wm-content, #fafafa); }
  #tools button[aria-pressed="true"] { background: var(--wm-fill-strong, #8882); font-weight: 600; }
  .tool-space { flex: 1; }
  #selection-tools { position: absolute; z-index: 2; top: 8px; left: 52px; display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: 6px; background: var(--wm-surface, #fafafa); box-shadow: 0 1px 4px #0002; }
  #surface { position: relative; flex: none; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #object-list { display: flex; flex-direction: column; max-height: 50vh; overflow: auto; }
  #object-list button { text-align: left; }
  #viewport { flex: 1; min-height: 0; overflow: auto; background: var(--wm-fill, #8881); cursor: grab; touch-action: pan-x pan-y; }
  #viewport.panning { cursor: grabbing; user-select: none; }
  #canvas { display: flex; align-items: center; justify-content: center; width: max-content; height: max-content; min-width: 100%; min-height: 100%; padding: 24px; }
  #image { display: block; flex: none; max-width: none; background: white; user-select: none; pointer-events: none; }
  #image.paper-dark { background: #18181b; }
  #image.paper-none { background: transparent; }
  #preview-empty { padding: 20px; color: var(--wm-text-dim, #73737b); }
  wm-notice { flex: none; }
  [hidden] { display: none !important; }
  dialog { width: min(500px, calc(100vw - 24px)); padding: 24px; color: var(--wm-text, #242428); background: var(--wm-surface, var(--wm-content, #fafafa)); border: 1px solid var(--wm-hairline, #8884); border-radius: 12px; }
  dialog::backdrop { background: #0005; }
  dialog h2 { font-size: 20px; margin: 0 0 12px; }
  dialog p { line-height: 1.6; margin: 0 0 16px; }
  dialog label { display: block; margin: 12px 0 6px; }
  .actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 16px; }
  #draft-list { display: flex; flex-direction: column; max-height: 50vh; overflow: auto; gap: 4px; }
  #draft-list button { text-align: left; white-space: normal; overflow-wrap: anywhere; }
  @media (max-width: 650px) {
    #workspace { grid-template-columns: minmax(0, 1fr); grid-template-rows: 42% minmax(0, 1fr); }
    #source-pane { border-right: 0; border-bottom: 1px solid var(--wm-hairline, #8883); }
    #workspace.preview-only { grid-template-rows: minmax(0, 1fr); }
    #preview-tools { padding: 0 4px; }
  }
</style>
</head>
<body>
<main>
  <div id="workspace" class="preview-only">
    <section id="source-pane" aria-label="SVG source editor">
      <div class="pane-heading"><label for="source">SVG source</label><span id="position">Line 1, col 1</span></div>
      <textarea id="source" aria-label="SVG source" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" maxlength="200000"></textarea>
    </section>
    <section id="preview-pane" aria-label="Diagram canvas">
      <div id="selection-tools" role="toolbar" aria-label="Selected object" hidden><button id="edit-label" class="icon" aria-label="Edit text" title="Edit text" hidden><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h12M10 4v12M7 16h6"/></svg></button><button id="style" class="icon" aria-label="Object style" title="Object style" ><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3l4 4-8 8H5v-4zM11 5l4 4M3 18h14"/></svg></button><button id="delete" class="icon" aria-label="Delete object" title="Delete object (Backspace)" ><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h14M7 5V3h6v2M5 5l1 12h8l1-12M8 8v6M12 8v6"/></svg></button></div>
      <div id="drawing-area">
        <aside id="tools" aria-label="Drawing tools">
          <button class="icon" data-tool="select" aria-label="Select and move" aria-pressed="true" title="Select and move (V)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2l12 8-6 1-3 6z"/></svg></button>
          <button class="icon" data-tool="rect" aria-label="Draw box" aria-pressed="false" title="Draw box (R)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="1"/></svg></button>
          <button class="icon" data-tool="ellipse" aria-label="Draw ellipse" aria-pressed="false" title="Draw ellipse (E)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="10" cy="10" rx="7" ry="6"/></svg></button>
          <button class="icon" data-tool="line" aria-label="Draw line" aria-pressed="false" title="Draw line (L)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16L16 4"/><circle cx="4" cy="16" r="1"/><circle cx="16" cy="4" r="1"/></svg></button>
          <button class="icon" data-tool="text" aria-label="Add text" aria-pressed="false" title="Add text (T)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h14M10 4v12M7 16h6"/></svg></button>
          <button class="icon" data-tool="hand" aria-label="Pan canvas" aria-pressed="false" title="Pan canvas (H)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 10V5a1.5 1.5 0 013 0v5-6a1.5 1.5 0 013 0v6-5a1.5 1.5 0 013 0v6-3a1.5 1.5 0 013 0v5c0 4-3 6-6 6H9c-2 0-3-1-4-3l-3-5a1.5 1.5 0 012-2l2 2z"/></svg></button>
          <span class="tool-space"></span><button id="undo" class="icon" aria-label="Undo" title="Undo (⌘Z)" ><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4L3 8l4 4M3 8h8a5 5 0 010 10"/></svg></button><button id="redo" class="icon" aria-label="Redo" title="Redo (⇧⌘Z)" ><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4l4 4-4 4M17 8H9a5 5 0 000 10"/></svg></button>
        </aside>
        <div id="viewport" tabindex="0" aria-label="Diagram viewport; Hand tool to pan, control-scroll to zoom">
          <div id="canvas"><div id="surface"><img id="image" alt="SVG diagram" draggable="false" hidden><canvas id="overlay" tabindex="0" aria-label="Diagram canvas. Use drawing tools, click to select, drag to move, drag corner handles to resize. Brackets cycle objects; arrows move selection." hidden></canvas></div><p id="preview-empty">Choose a drawing tool to begin.</p></div>
        </div>
      </div>
      <div id="preview-tools" role="toolbar" aria-label="Canvas view">
        <button id="fit" class="icon" aria-label="Fit diagram" title="Fit diagram (0)" ><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3H3v4M13 3h4v4M3 13v4h4M17 13v4h-4"/></svg></button><button id="zoom-out" class="icon" aria-label="Zoom out" title="Zoom out (−)" ><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12"/></svg></button><button id="actual" aria-label="Actual size" title="Actual size"><span id="zoom-value">100%</span></button><button id="zoom-in" class="icon" aria-label="Zoom in" title="Zoom in (+)" ><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12M10 4v12"/></svg></button><span class="space"></span><button id="objects" class="icon" aria-label="Diagram objects" title="Diagram objects" ><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10M7 10h10M7 16h10"/><circle cx="3" cy="4" r=".5"/><circle cx="3" cy="10" r=".5"/><circle cx="3" cy="16" r=".5"/></svg></button><button id="source-toggle" class="icon" aria-label="SVG source" title="SVG source" aria-pressed="false"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5l-4 5 4 5M14 5l4 5-4 5M12 3L8 17"/></svg></button><select id="paper" aria-label="Canvas background" title="Canvas background"><option value="light">Light</option><option value="dark">Dark</option><option value="none">None</option></select>
      </div>
    </section>
  </div>
  <wm-notice id="notice" tone="amber" hidden role="status"><span id="notice-text"></span><button id="locate-error" hidden>Go to error</button></wm-notice>
</main>
<dialog id="text-dialog"><form id="text-form"><h2 id="text-title">Add text</h2><label for="label-text">Label</label><input id="label-text" required maxlength="2000" value="Text"><div class="actions"><button type="button" id="text-cancel">Cancel</button><button class="primary">Apply</button></div></form></dialog>
<dialog id="style-dialog"><form id="style-form"><h2>Object style</h2><label for="fill">Fill</label><input id="fill" value="none" placeholder="none or #ffffff"><label for="stroke">Stroke</label><input id="stroke" value="#475569"><label for="stroke-width">Stroke width</label><input id="stroke-width" type="number" min="0" max="1000" step="0.5" value="2"><div id="font-size-field" hidden><label for="font-size">Text size</label><input id="font-size" type="number" min="1" max="1000" value="24"></div><div class="actions"><button type="button" id="style-cancel">Cancel</button><button class="primary">Apply</button></div></form></dialog>
<dialog id="objects-dialog"><h2>Diagram objects</h2><p>Select an object, then use the arrow keys or drag it on the canvas.</p><div id="object-list"></div><div class="actions"><button id="objects-close">Done</button></div></dialog>
<script src="preview.js"></script>
<script src="canvas.js"></script>
<script src="source-sync.js"></script>
<script src="editor.js"></script>
</body>
</html>
